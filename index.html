<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>場地預約示範</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f8; --fg: #1d2327; --muted: #5b6770; --bar: #20313a; --bar-fg: #ffffff; --link: #ffd27a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14191c; --fg: #e8ecef; --muted: #a7b3bb; } }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang HK", sans-serif; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background: var(--bar); color: var(--bar-fg); font-size: 13px; }
    .bar strong { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar a { color: var(--link); white-space: nowrap; }
    .stage { position: relative; flex: 1; min-height: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; background: var(--bg); }
    .fallback.show { display: flex; }
    .fallback p { max-width: 520px; margin: 0 auto 16px; color: var(--muted); }
    .fallback a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #1f6f8b; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>場地預約示範 Venue Booking Demo（資料是虛構的 · Fictitious data）</strong>
    <a id="open-new" href="https://script.google.com/macros/s/AKfycbxMei-BbRA05wyZfr_Vq3eJx6yW1YsXTFse3KizJs2Dhuo3P6CUVMVpeC59bkXLcUBvFw/exec" target="_blank" rel="noopener noreferrer">在新分頁開啟 Open in new tab</a>
  </div>
  <div class="stage">
    <iframe id="demo" title="場地預約示範 Venue Booking Demo" src="about:blank" allow="clipboard-write"></iframe>
    <div class="fallback" id="fallback" role="alert">
      <div>
        <p>示範頁面未能在這裏顯示。請按下面的按鈕在新分頁開啟。<br>The demo could not be shown here. Please open it in a new tab.</p>
        <a id="fallback-link" href="https://script.google.com/macros/s/AKfycbxMei-BbRA05wyZfr_Vq3eJx6yW1YsXTFse3KizJs2Dhuo3P6CUVMVpeC59bkXLcUBvFw/exec" target="_blank" rel="noopener noreferrer">在新分頁開啟 Open in new tab</a>
      </div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      // 部署公開示範版後，把 https://script.google.com/macros/s/AKfycbxMei-BbRA05wyZfr_Vq3eJx6yW1YsXTFse3KizJs2Dhuo3P6CUVMVpeC59bkXLcUBvFw/exec 換成 Web App 網址（https://script.google.com/macros/s/…/exec）。
      var URL_TEXT = 'https://script.google.com/macros/s/AKfycbxMei-BbRA05wyZfr_Vq3eJx6yW1YsXTFse3KizJs2Dhuo3P6CUVMVpeC59bkXLcUBvFw/exec';
      var frame = document.getElementById('demo');
      var fallback = document.getElementById('fallback');
      var valid = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(URL_TEXT);
      var loaded = false;
      function showFallback() { if (!loaded) fallback.classList.add('show'); }
      if (!valid) {
        fallback.classList.add('show');
        return;
      }
      frame.addEventListener('load', function () { if (frame.src !== 'about:blank') loaded = true; });
      frame.addEventListener('error', showFallback);
      frame.src = URL_TEXT;
      // Apps Script 第一次開啟可能較慢；20 秒仍未載入就顯示在新分頁開啟的連結。
      setTimeout(showFallback, 20000);
    })();
  </script>
</body>
</html>
